
<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background-color: #0f172a; color: white; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
        #container { width: 100vw; height: 100vh; position: relative; display: flex; justify-content: center; align-items: center; }
        canvas { cursor: move; border-radius: 16px; background: #0f172a; }
        
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
        }
        
        .card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            width: 280px;
            pointer-events: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        
        h1 { margin: 0; font-size: 1.5rem; font-weight: 800; color: #f8fafc; }
        p { font-size: 0.85rem; color: #94a3b8; line-height: 1.4; margin: 8px 0 16px 0; }
        
        .control-group { margin-bottom: 12px; }
        .label-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.8rem; font-weight: 600; }
        .val { color: #38bdf8; font-family: monospace; }
        
        input[type=range] {
            width: 100%;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            height: 4px;
            border-radius: 2px;
            outline: none;
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #38bdf8;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        
        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.7rem;
        }
        
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .color-box { width: 10px; height: 10px; border-radius: 2px; }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .mode-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 700;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .mode-btn.active {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
            color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }
        
        .stats {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        
        .loss-display {
            font-size: 2rem;
            font-weight: 800;
            color: #38bdf8;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            margin: 4px 0;
        }
        
        .loss-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #64748b;
        }

        .hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: #475569;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
        
        <div class="ui-overlay">
            <div class="card">
                <h1>Objective Explorer ⛰️</h1>
                <p>A "Mountain" represents a simplified objective value. Lower altitude = lower objective for this toy example.</p>
                
                <div class="control-group">
                    <div class="label-row"><span>Topography</span></div>
                    <div class="btn-group">
                        <button class="mode-btn active" id="btn-convex">Convex</button>
                        <button class="mode-btn" id="btn-nonconvex">Complex</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <div class="label-row"><span>Weight <i>w</i><sub>1</sub></span><span class="val" id="w1-val">0.00</span></div>
                    <input type="range" id="w1-slider" min="-3" max="3" step="0.05" value="1.5">
                </div>
                
                <div class="control-group">
                    <div class="label-row"><span>Weight <i>w</i><sub>2</sub></span><span class="val" id="w2-val">0.00</span></div>
                    <input type="range" id="w2-slider" min="-3" max="3" step="0.05" value="1.5">
                </div>
                
                <div class="stats">
                    <div class="loss-label">Current Altitude (Loss)</div>
                    <div class="loss-display" id="loss-val">0.00</div>
                </div>
            </div>
        </div>
        
        <div class="hint">Drag to Rotate | Ctrl + Scroll (or pinch) to Zoom</div>

        <div class="legend">
            <div class="legend-item"><div class="color-box" style="background: #ef4444;"></div> Peaks (High Loss)</div>
            <div class="legend-item"><div class="color-box" style="background: #eab308;"></div> Slopes</div>
            <div class="legend-item"><div class="color-box" style="background: #3b82f6;"></div> Valleys (Low Loss)</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const w1Slider = document.getElementById('w1-slider');
        const w2Slider = document.getElementById('w2-slider');
        const w1Val = document.getElementById('w1-val');
        const w2Val = document.getElementById('w2-val');
        const lossVal = document.getElementById('loss-val');
        const btnConvex = document.getElementById('btn-convex');
        const btnNonConvex = document.getElementById('btn-nonconvex');

        let width, height;
        let rotationX = 0.6;
        let rotationZ = 0.7;
        let zoom = 1;          // user zoom multiplier (Ctrl + wheel)
        let view = { s: 60, cx: 0, cy: 0, ox: 0 };  // auto-fit scale/centre, updated every draw
        let mode = 'convex';
        
        // Interaction state
        let isDragging = false;
        let lastMouseX, lastMouseY;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        window.addEventListener('resize', () => { resize(); requestDraw(); });
        resize();

        // Mathematical Surfaces (minimum loss is ~0 for both).
        // The "Complex" surface is the same one used for "Lumpy Terrain" on Page 52.
        function getLoss(x, z) {
            if (mode === 'convex') {
                return (x*x + z*z) * 0.3;
            } else {
                return (x*x + z*z) * 0.2 +
                       0.5 * Math.sin(x * 3) * Math.cos(z * 3) +
                       0.3 * Math.cos(x * 1.5) + 0.25;
            }
        }

        // Projection Engine (orthographic camera above the surface).
        // z is mirrored so the view from above matches a map: w1 → right, w2 → away/up.
        function project(x, y, z) {
            const zm = -z;
            // Spin around the vertical (loss) axis
            let x1 = x * Math.cos(rotationZ) - zm * Math.sin(rotationZ);
            let z1 = x * Math.sin(rotationZ) + zm * Math.cos(rotationZ);
            
            // Tilt around the screen's horizontal axis
            let y1 = y * Math.cos(rotationX) - z1 * Math.sin(rotationX);
            let z2 = y * Math.sin(rotationX) + z1 * Math.cos(rotationX); // larger = closer to the viewer
            
            return {
                x: view.ox + (x1 - view.cx) * view.s,
                y: height / 2 - (y1 - view.cy) * view.s,
                depth: z2,
                rx: x1,
                ry: y1
            };
        }

        // Fit the whole surface into the canvas (then apply the user's zoom).
        function fitView() {
            const N = 20, R = 3.5;
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            for (let i = 0; i <= N; i++) {
                for (let j = 0; j <= N; j++) {
                    const x = -R + 2 * R * i / N, z = -R + 2 * R * j / N;
                    const p = project(x, getLoss(x, z), z);
                    minX = Math.min(minX, p.rx); maxX = Math.max(maxX, p.rx);
                    minY = Math.min(minY, p.ry); maxY = Math.max(maxY, p.ry);
                }
            }
            // Leave room for the control card on the left when there is space for it
            const leftPad = width > 760 ? 330 : 0;
            const avail = width - leftPad;
            view.ox = leftPad + avail / 2;
            const fit = Math.min(avail * 0.92 / Math.max(maxX - minX, 1e-9), height * 0.85 / Math.max(maxY - minY, 1e-9));
            view.s = fit * zoom;
            view.cx = (minX + maxX) / 2;
            view.cy = (minY + maxY) / 2;
        }

        function getColor(y, minY, maxY) {
            const t = Math.max(0, Math.min(1, (y - minY) / Math.max(maxY - minY, 1e-9)));
            if (t < 0.3) {
                // Deep blue to light blue
                return `hsl(217, 91%, ${20 + t * 100}%)`;
            } else if (t < 0.7) {
                // Blue to yellow
                return `hsl(${217 - (t-0.3)*400}, 91%, 60%)`;
            } else {
                // Yellow to red
                return `hsl(${45 - (t-0.7)*150}, 91%, 50%)`;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            fitView();
            
            const N = 40;
            const R = 3.5;
            const step = (2 * R) / N;
            
            const polygons = [];
            let minY = Infinity;
            let maxY = -Infinity;
            
            // Generate grid polygons
            for (let i = 0; i < N; i++) {
                for (let j = 0; j < N; j++) {
                    const x0 = -R + i * step;
                    const z0 = -R + j * step;
                    const x1 = x0 + step;
                    const z1 = z0 + step;
                    
                    const y00 = getLoss(x0, z0);
                    const y10 = getLoss(x1, z0);
                    const y01 = getLoss(x0, z1);
                    const y11 = getLoss(x1, z1);
                    
                    const p00 = project(x0, y00, z0);
                    const p10 = project(x1, y10, z0);
                    const p01 = project(x0, y01, z1);
                    const p11 = project(x1, y11, z1);
                    
                    const avgY = (y00 + y10 + y01 + y11) / 4;
                    minY = Math.min(minY, y00, y10, y01, y11);
                    maxY = Math.max(maxY, y00, y10, y01, y11);
                    const avgDepth = (p00.depth + p10.depth + p01.depth + p11.depth) / 4;
                    
                    polygons.push({
                        points: [p00, p10, p11, p01],
                        depth: avgDepth,
                        color: null,
                        y: avgY
                    });
                }
            }

            polygons.forEach(p => { p.color = getColor(p.y, minY, maxY); });
            
            // Sort by depth (Painter's Algorithm): farthest first, closest last
            polygons.sort((a, b) => a.depth - b.depth);
            
            // Render Surface
            polygons.forEach(p => {
                ctx.beginPath();
                ctx.moveTo(p.points[0].x, p.points[0].y);
                ctx.lineTo(p.points[1].x, p.points[1].y);
                ctx.lineTo(p.points[2].x, p.points[2].y);
                ctx.lineTo(p.points[3].x, p.points[3].y);
                ctx.closePath();
                
                ctx.fillStyle = p.color;
                ctx.fill();
                
                // Subtle mesh lines
                ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                ctx.lineWidth = 0.5;
                ctx.stroke();
            });

            // Draw current point (The Ball)
            const w1 = parseFloat(w1Slider.value);
            const w2 = parseFloat(w2Slider.value);
            const l = getLoss(w1, w2);
            const pb = project(w1, l, w2);
            
            // Ball shadow/glow on surface
            ctx.beginPath();
            ctx.ellipse(pb.x, pb.y + 2, 8, 4, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fill();
            
            // The Ball (drawn last so it always stays visible)
            ctx.beginPath();
            ctx.arc(pb.x, pb.y - 10, 6, 0, Math.PI * 2);
            const grad = ctx.createRadialGradient(pb.x - 2, pb.y - 12, 1, pb.x, pb.y - 10, 6);
            grad.addColorStop(0, '#fff');
            grad.addColorStop(1, '#38bdf8');
            ctx.fillStyle = grad;
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Update UI
            w1Val.textContent = w1.toFixed(2);
            w2Val.textContent = w2.toFixed(2);
            lossVal.textContent = l.toFixed(2);
        }

        // Redraw only when something changes (no idle animation loop).
        let drawPending = false;
        function requestDraw() {
            if (drawPending) return;
            drawPending = true;
            requestAnimationFrame(() => { drawPending = false; draw(); });
        }

        // Event Listeners (pointer events: mouse, pen and touch)
        canvas.style.touchAction = 'none';
        canvas.addEventListener('pointerdown', e => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            canvas.setPointerCapture(e.pointerId);
        });

        canvas.addEventListener('pointermove', e => {
            if (!isDragging) return;
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            rotationZ += dx * 0.01;
            rotationX += dy * 0.01;
            rotationX = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, rotationX));
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            requestDraw();
        });

        const endDrag = () => { isDragging = false; };
        canvas.addEventListener('pointerup', endDrag);
        canvas.addEventListener('pointercancel', endDrag);
        
        // Only zoom with Ctrl/⌘ (trackpad pinch also sets ctrlKey) so normal
        // scrolling still scrolls the Streamlit page.
        canvas.addEventListener('wheel', e => {
            if (!e.ctrlKey && !e.metaKey) return;
            e.preventDefault();
            zoom *= Math.exp(-e.deltaY * 0.001);
            zoom = Math.max(0.4, Math.min(2.5, zoom));
            requestDraw();
        }, { passive: false });

        w1Slider.addEventListener('input', requestDraw);
        w2Slider.addEventListener('input', requestDraw);

        btnConvex.addEventListener('click', () => {
            mode = 'convex';
            btnConvex.classList.add('active');
            btnNonConvex.classList.remove('active');
            requestDraw();
        });

        btnNonConvex.addEventListener('click', () => {
            mode = 'nonconvex';
            btnNonConvex.classList.add('active');
            btnConvex.classList.remove('active');
            requestDraw();
        });

        draw();
    </script>
</body>
</html>
