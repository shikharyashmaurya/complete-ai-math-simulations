
    <!DOCTYPE html>
    <html>
    <head>
    <style>
        body { margin: 0; padding: 0; background: transparent; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; justify-content: center; align-items: center; }
        
        .machine-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 800px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        /* Animated grid background */
        .machine-container::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-size: 30px 30px;
            background-image: linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            z-index: 0;
        }

        .element {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .orb {
            width: 80px; height: 80px;
            border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: 900; font-size: 24px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            color: #0b1020;
        }
        
        .label {
            margin-top: 12px;
            font-size: 14px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .orb-input { background: #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
        .orb-output { background: #4ade80; box-shadow: 0 0 20px rgba(74, 222, 128, 0.4); }

        .box {
            background: #1e293b;
            border: 3px solid;
            border-radius: 12px;
            padding: 20px 30px;
            color: white;
            text-align: center;
            min-width: 120px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .box-w { border-color: #fbbf24; }
        .box-b { border-color: #f472b6; }

        .box-title { font-size: 14px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; font-weight: bold; }
        .box-val { font-size: 24px; font-weight: 900; }
        .box-w .box-val { color: #fbbf24; }
        .box-b .box-val { color: #f472b6; }

        .path {
            flex-grow: 1;
            height: 4px;
            background: rgba(255,255,255,0.1);
            position: relative;
            margin: 0 20px;
            border-radius: 2px;
            z-index: 5;
        }

        .path::after {
            content: '';
            position: absolute;
            right: -2px; top: -6px;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-left: 12px solid rgba(255,255,255,0.2);
        }

        /* Flow Animation Particles */
        .particle {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 12px; height: 12px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 0 10px white;
            opacity: 0;
            animation: flow 3s infinite linear;
        }

        .p1 { animation-delay: 0s; background: #38bdf8; }
        .p2 { animation-delay: 1.5s; background: #fbbf24; }

        @keyframes flow {
            0% { left: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { left: 100%; opacity: 0; }
        }

        .math-symbol {
            font-size: 32px;
            font-weight: 900;
            color: #64748b;
            margin: 0 15px;
            z-index: 10;
        }

    </style>
    </head>
    <body>
        <div class="machine-container">
            <!-- Input -->
            <div class="element">
                <div class="orb orb-input">x</div>
                <div class="label">Input</div>
            </div>

            <div class="path">
                <div class="particle p1"></div>
            </div>

            <!-- Weight -->
            <div class="element">
                <div class="box box-w">
                    <div class="box-title">Multiply</div>
                    <div class="box-val">× w</div>
                </div>
                <div class="label">Sensitivity</div>
            </div>

            <div class="math-symbol">→</div>

            <!-- Bias -->
            <div class="element">
                <div class="box box-b">
                    <div class="box-title">Add</div>
                    <div class="box-val">+ b</div>
                </div>
                <div class="label">Shift</div>
            </div>

            <div class="path">
                <div class="particle p2"></div>
            </div>

            <!-- Output -->
            <div class="element">
                <div class="orb orb-output">y</div>
                <div class="label">Output</div>
            </div>
        </div>
    </body>
    </html>
