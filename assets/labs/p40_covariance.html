
<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: transparent;
    color: white;
    font-family: 'Inter', system-ui, sans-serif;
    user-select: none;
    overflow: hidden;
  }
  #app {
    position: relative;
    width: 100%;
    height: 690px;
    background: linear-gradient(145deg, #111827, #1f2937);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .dashboard {
    display: flex;
    gap: 30px;
    margin-top: 30px;
    z-index: 10;
  }
  .metric {
    background: rgba(255,255,255,0.03);
    padding: 15px 30px;
    border-radius: 12px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.08);
    min-width: 220px;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  .metric .label {
    font-size: 14px;
    color: #9ca3af;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 5px;
  }
  .metric .value {
    font-size: 36px;
    font-weight: 800;
  }
  #cov-val { transition: color 0.3s; }
 
  .controls {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 15px;
    background: rgba(0,0,0,0.2);
    padding: 10px 25px;
    border-radius: 20px;
  }
  .controls label {
    font-size: 14px;
    color: #cbd5e1;
    font-weight: bold;
  }
  input[type=range] {
    width: 300px;
    accent-color: #3b82f6;
    cursor: pointer;
  }
 
  .canvas-container {
    position: relative;
    flex-grow: 1;
    width: 100%;
    margin-top: 15px;
    margin-bottom: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  canvas {
    background: #0f172a;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
  }
  .metric .sub {
    font-size: 12px;
    color: #9ca3af;
    margin-top: 4px;
    min-height: 15px;
  }
  .controls select, .controls button {
    background: #1e293b;
    color: #e2e8f0;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    padding: 5px 10px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .controls button:hover { background: #334155; }
  canvas { max-width: 96%; height: auto; }
</style>
</head>
<body>
<div id="app">
  <div class="dashboard">
    <div class="metric"><div class="label">Sample Covariance (÷ n−1)</div><div class="value" id="cov-val">0.00</div><div class="sub" id="cov-sub"></div></div>
    <div class="metric"><div class="label">Relationship</div><div class="value" id="rel-val" style="font-size:26px; padding-top:8px;">Zero</div><div class="sub" id="rel-sub"></div></div>
  </div>

  <div class="controls">
    <label for="angle-slider">Rotate Cloud:</label>
    <input type="range" id="angle-slider" min="0" max="180" value="45">
    <span id="angle-display" style="width: 45px; text-align:right; font-family:monospace; font-size:16px;">45°</span>
  </div>
  <div class="controls">
    <label for="unit-select">Measure X in:</label>
    <select id="unit-select">
      <option value="1">metres (×1)</option>
      <option value="100">centimetres (×100)</option>
      <option value="1000">millimetres (×1000)</option>
    </select>
    <button id="resample-btn">🎲 New random sample</button>
  </div>

  <div class="canvas-container">
    <canvas id="plot" width="600" height="380"></canvas>
  </div>
</div>

<script>
  const canvas = document.getElementById('plot');
  const ctx = canvas.getContext('2d');
  const slider = document.getElementById('angle-slider');
  const unitSelect = document.getElementById('unit-select');
  const resampleBtn = document.getElementById('resample-btn');
  const covValEl = document.getElementById('cov-val');
  const covSubEl = document.getElementById('cov-sub');
  const relValEl = document.getElementById('rel-val');
  const relSubEl = document.getElementById('rel-sub');
  const angleDispEl = document.getElementById('angle-display');

  const NUM_POINTS = 250;
  let basePoints = [];
  let seed = 40;
  let scale = 50; // pixels per unit (recomputed so the whole cloud fits)

  // Small seeded PRNG so the cloud is reproducible until you ask for a new sample
  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // Box-Muller transform for normal distribution
  function randn_bm(rand) {
      let u = 0, v = 0;
      while(u === 0) u = rand();
      while(v === 0) v = rand();
      return Math.sqrt( -2.0 * Math.log( u ) ) * Math.cos( 2.0 * Math.PI * v );
  }

  // Create an elongated cloud horizontally (strong variance in X, small in Y)
  function generate() {
    const rand = mulberry32(seed);
    basePoints = [];
    let maxR = 0;
    for (let i = 0; i < NUM_POINTS; i++) {
      let x = randn_bm(rand) * 2.0;
      let y = randn_bm(rand) * 0.4;
      basePoints.push({x, y});
      maxR = Math.max(maxR, Math.hypot(x, y));
    }
    // Rotation preserves distance from the origin, so this scale fits every angle
    scale = Math.min(60, (Math.min(canvas.width, canvas.height) / 2 - 8) / maxR);
  }

  function fmtSigned(v) {
    const s = Math.abs(v) >= 1000 ? v.toFixed(0) : v.toFixed(2);
    return v > 0 ? '+' + s : s;
  }

  function drawAndCalculate() {
    let angleDeg = parseInt(slider.value);
    angleDispEl.innerText = angleDeg + '°';
    let angleRad = angleDeg * Math.PI / 180;
    const unit = parseFloat(unitSelect.value);
    const unitName = unitSelect.options[unitSelect.selectedIndex].text.split(' ')[0];

    // Rotate points (drawing coordinates, X in metres)
    let points = basePoints.map(p => {
      return {
        x: p.x * Math.cos(angleRad) - p.y * Math.sin(angleRad),
        y: p.x * Math.sin(angleRad) + p.y * Math.cos(angleRad)
      };
    });

    let sumX = 0, sumY = 0;
    points.forEach(p => { sumX += p.x; sumY += p.y; });
    let meanX = sumX / NUM_POINTS;
    let meanY = sumY / NUM_POINTS;

    // Sample covariance, variances (X in metres)
    let sxy = 0, sxx = 0, syy = 0;
    points.forEach(p => {
      const dx = p.x - meanX, dy = p.y - meanY;
      sxy += dx * dy; sxx += dx * dx; syy += dy * dy;
    });
    const covM = sxy / (NUM_POINTS - 1);
    const varX = sxx / (NUM_POINTS - 1);
    const varY = syy / (NUM_POINTS - 1);
    // Changing the unit of X rescales covariance, but not the correlation
    const cov = covM * unit;
    const covPop = sxy / NUM_POINTS * unit;
    const r = (varX > 0 && varY > 0) ? covM / Math.sqrt(varX * varY) : 0;

    // UI Update
    covValEl.innerText = fmtSigned(cov);
    covSubEl.innerText = `population (÷ n): ${fmtSigned(covPop)} · X in ${unitName}`;

    let color;
    if (Math.abs(r) < 0.1) {
      color = '#9ca3af'; relValEl.innerText = '≈ Zero';
    } else if (cov > 0) {
      color = '#10b981'; relValEl.innerText = 'Positive';
    } else {
      color = '#ef4444'; relValEl.innerText = 'Negative';
    }
    covValEl.style.color = color;
    relValEl.style.color = color;
    relSubEl.innerText = `unit-free correlation r = ${fmtSigned(r)}`;

    // --- DRAWING ---
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let cx = canvas.width / 2;
    let cy = canvas.height / 2;

    // Draw contribution quadrants relative to the sample means
    let meanCx = Math.max(0, Math.min(canvas.width, cx + meanX * scale));
    let meanCy = Math.max(0, Math.min(canvas.height, cy - meanY * scale));
    // Top-Right & Bottom-Left (Positive Contribution)
    ctx.fillStyle = 'rgba(16, 185, 129, 0.08)';
    ctx.fillRect(meanCx, 0, canvas.width - meanCx, meanCy); // TR
    ctx.fillRect(0, meanCy, meanCx, canvas.height - meanCy); // BL

    // Top-Left & Bottom-Right (Negative Contribution)
    ctx.fillStyle = 'rgba(239, 68, 68, 0.08)';
    ctx.fillRect(0, 0, meanCx, meanCy); // TL
    ctx.fillRect(meanCx, meanCy, canvas.width - meanCx, canvas.height - meanCy); // BR

    // Draw Axes (origin)
    ctx.beginPath();
    ctx.moveTo(0, cy);
    ctx.lineTo(canvas.width, cy);
    ctx.moveTo(cx, 0);
    ctx.lineTo(cx, canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Dashed lines through the sample means = the quadrant boundaries
    ctx.beginPath();
    ctx.moveTo(meanCx, 0); ctx.lineTo(meanCx, canvas.height);
    ctx.moveTo(0, meanCy); ctx.lineTo(canvas.width, meanCy);
    ctx.strokeStyle = 'rgba(251, 191, 36, 0.45)';
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Axis Labels
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '14px system-ui, sans-serif';
    ctx.fillText("X", canvas.width - 20, cy - 10);
    ctx.fillText("Y", cx + 10, 20);
    ctx.fillStyle = 'rgba(251, 191, 36, 0.8)';
    ctx.font = '12px system-ui, sans-serif';
    ctx.fillText("x̄", Math.min(canvas.width - 14, meanCx + 4), canvas.height - 8);
    ctx.fillText("ȳ", 6, Math.max(14, meanCy - 4));

    // Faint points when the relationship is weak, solid when it is strong
    const alpha = Math.abs(r) < 0.3 ? 0.4 + 0.6 * (Math.abs(r) / 0.3) : 1.0;

    // Draw Points
    points.forEach(p => {
      let px = cx + p.x * scale;
      let py = cy - p.y * scale; // Invert Y for canvas

      // Covariance contributions depend on deviations from both sample means.
      let pc = '';
      if (((p.x - meanX) > 0 && (p.y - meanY) > 0) ||
          ((p.x - meanX) < 0 && (p.y - meanY) < 0)) {
         pc = 'rgba(16, 185, 129, 0.9)'; // Greenish for positive contribution
      } else {
         pc = 'rgba(239, 68, 68, 0.9)'; // Reddish for negative contribution
      }

      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(px, py, 4, 0, 2*Math.PI);
      ctx.fillStyle = pc;
      ctx.fill();

      // Small stroke for clarity
      ctx.lineWidth = 0.5;
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.stroke();
    });
    ctx.globalAlpha = 1.0;

    // Least-squares line of Y on X (slope = Cov/Var(X)); not the cloud's long axis
    if (varX > 1e-12) {
      let slope = covM / varX;
      let half = (canvas.width / 2) / scale;
      let x1 = -half, x2 = half;
      let y1 = meanY + slope * (x1 - meanX);
      let y2 = meanY + slope * (x2 - meanX);

      ctx.beginPath();
      ctx.moveTo(cx + x1 * scale, cy - y1 * scale);
      ctx.lineTo(cx + x2 * scale, cy - y2 * scale);
      ctx.strokeStyle = Math.abs(r) < 0.1 ? 'rgba(255, 255, 255, 0.35)' : 'rgba(255, 255, 255, 0.8)';
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 8]);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.font = '12px system-ui, sans-serif';
      ctx.fillText('- - least-squares line (Y on X)', 10, canvas.height - 10);
    }
  }

  slider.addEventListener('input', drawAndCalculate);
  unitSelect.addEventListener('change', drawAndCalculate);
  resampleBtn.addEventListener('click', () => { seed += 1; generate(); drawAndCalculate(); });
  generate();
  drawAndCalculate(); // Init

</script>
</body>
</html>
